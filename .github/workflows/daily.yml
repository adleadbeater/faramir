name: Faramir Daily
# Fail closed (P0-7). Nothing here runs in production unless the repository variable
# FARAMIR_ENABLED is exactly 'true' — an unset variable means disabled. A manual dispatch may
# run a dry run (every write recorded, none performed) while production is disabled.
on:
  schedule:
    # GitHub drops most scheduled triggers (2026-10-30..11-01: two runs a day, the first at 1:53-2:28pm ET),
    # so a trigger no longer means "check the chart now". Each trigger starts a *waiting* job that polls The
    # Numbers every 5 minutes from 10am ET until the chart is ready (faramir/chart_watch.py, never later than
    # 3pm ET). Several triggers are backups for dropped ones: once today's cards are delivered, later jobs
    # exit within a minute. Off-the-hour minutes: GitHub delays top-of-hour schedules most.
    - cron: '7 14,15,16,17,18,19 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: record every write, perform none (allowed while production is disabled)"
        type: boolean
        default: true
      copy_sheet_id:
        description: "Dry run only: read a COPY of the workbook instead (migration rehearsal). Ignored on a real run"
        required: false
        default: ""

permissions:
  contents: write   # commits the chart-watch learning (public chart timings only) to the faramir-state branch

jobs:
  # Waits for the chart, holding no credentials and no state lock (so it can run for hours without
  # breaking the lock-lease rule below). It only polls The Numbers' public chart and records when films
  # appear; the "run" job then decides and posts. One waiting job at a time; a trigger that arrives
  # meanwhile queues (the newest replaces an older queued one).
  wait:
    if: ${{ vars.FARAMIR_ENABLED == 'true' && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    concurrency:
      group: faramir-chart-wait
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements-dev.txt

      - name: Tests (no credentials, network blocked) — must pass before anything else
        run: python -m pytest -q

      - name: Chart-watch state
        run: |
          mkdir -p state
          if git fetch -q origin faramir-state 2>/dev/null; then git show FETCH_HEAD:chart_watch.json > state/chart_watch.json; else echo '{"days": {}}' > state/chart_watch.json; fi

      - name: Wait for yesterday's daily chart
        run: python scripts/run_daily.py --wait-for-chart
        env:
          FARAMIR_CHART_WATCH: state/chart_watch.json

      - name: Save chart-watch state
        if: always()
        run: |
          git config user.name "faramir-bot"
          git config user.email "faramir-bot@users.noreply.github.com"
          if git fetch -q origin faramir-state 2>/dev/null; then git worktree add -q -B faramir-state "$RUNNER_TEMP/fs" FETCH_HEAD; else git worktree add -q --orphan -b faramir-state "$RUNNER_TEMP/fs"; fi
          # Only the chart timings ("days"): never the "delivered" markers, which a run job on the same
          # branch may have written since this job fetched it (a stale copy would let a day post twice).
          python - "$RUNNER_TEMP/fs/chart_watch.json" <<'PY'
          import json, os, sys
          remote_path = sys.argv[1]
          remote = json.load(open(remote_path)) if os.path.exists(remote_path) else {"days": {}}
          remote["days"] = json.load(open("state/chart_watch.json")).get("days", {})
          json.dump(remote, open(remote_path, "w"), indent=1, sort_keys=True)
          PY
          cd "$RUNNER_TEMP/fs"
          git add chart_watch.json
          git diff --staged --quiet || git commit -qm "chart watch (waiting job) $(date -u +%FT%H:%M) [skip ci]"
          git push -q origin faramir-state

  run:
    needs: wait
    # The waiting job is skipped for manual dispatches (a dry run never waits); a failed or cancelled wait
    # means no run until the next trigger.
    if: ${{ always() && (needs.wait.result == 'success' || needs.wait.result == 'skipped') && (vars.FARAMIR_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && inputs.dry_run)) }}
    # One production run at a time across every Faramir workflow (state, history and delivery
    # protocols rely on it). Queued, never cancelled mid-run.
    concurrency:
      group: faramir-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # Well under the 45-minute state-lock lease (faramir.state_store.LOCK_TTL): GitHub stops a
    # stuck job long before its lease could lapse, and an expired lease refuses to write anyway.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements-dev.txt

      - name: Tests (no credentials, network blocked) — must pass before the run
        run: python -m pytest -q

      - name: Chart-watch state (when each film reports to The Numbers; public data only)
        run: |
          mkdir -p state
          if git fetch -q origin faramir-state 2>/dev/null; then git show FETCH_HEAD:chart_watch.json > state/chart_watch.json; else echo '{"days": {}}' > state/chart_watch.json; fi

      - name: Daily run
        # Exit 75 = the chart isn't ready yet: not a failure, the next trigger tries again.
        run: |
          set +e
          python scripts/run_daily.py --require-chart ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
          code=$?
          if [ "$code" -eq 75 ]; then echo "Chart not ready; the next trigger tries again."; exit 0; fi
          exit $code
        env:
          FARAMIR_ENABLED: ${{ vars.FARAMIR_ENABLED }}       # the code checks the same variable
          FARAMIR_PICK_ENGINE: ${{ vars.FARAMIR_PICK_ENGINE || 'cards' }}   # rollback: claude_select
          FARAMIR_COLLECT_HISTORY: 'false'                   # weekend history: off (PR-16)
          FARAMIR_CHART_WATCH: state/chart_watch.json
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          FARAMIR_SHEET_ID: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run && inputs.copy_sheet_id != '') && inputs.copy_sheet_id || secrets.FARAMIR_SHEET_ID }}
          CEREBRO_MW_SHEET_ID: ${{ secrets.CEREBRO_MW_SHEET_ID }}
          GITHUB_WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Save chart-watch state
        if: always() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        run: |
          git config user.name "faramir-bot"
          git config user.email "faramir-bot@users.noreply.github.com"
          if git fetch -q origin faramir-state 2>/dev/null; then git worktree add -q -B faramir-state "$RUNNER_TEMP/fs" FETCH_HEAD; else git worktree add -q --orphan -b faramir-state "$RUNNER_TEMP/fs"; fi
          cp state/chart_watch.json "$RUNNER_TEMP/fs/chart_watch.json"
          cd "$RUNNER_TEMP/fs"
          git add chart_watch.json
          git diff --staged --quiet || git commit -qm "chart watch $(date -u +%FT%H:%M) [skip ci]"
          git push -q origin faramir-state

      - name: Keep the run report (report.json, writes, Slack preview, state snapshot)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faramir-run-${{ github.run_id }}
          path: out/
          retention-days: 90
          if-no-files-found: ignore
